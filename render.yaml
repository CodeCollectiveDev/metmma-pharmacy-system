services:
  - type: web
    name: metmma-pharmacy-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DB_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: TAX_RATE_BPS
        value: "1650"
      - key: PHARMACY_TIMEZONE
        value: UTC
