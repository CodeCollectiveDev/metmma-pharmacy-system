name: Validate and Deploy to PM2

on:
  push:
    branches: [main, version-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/version-2'
    environment: ${{ github.ref_name == 'version-2' && 'version-2' || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run check --if-present
          npm test --if-present
          npm run build --if-present
          npm prune --production

      - name: Validate Frontend
        run: |
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Package Release
        run: |
          set -Eeuo pipefail
          # Copy repository database folder into backend directory before packaging
          cp -r database backend/database
          test -s backend/database/init.sql
          test -d backend/database/migrations
          tar -czf release.tar.gz -C backend .

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_DIRECTORY: ${{ github.ref_name == 'version-2' && 'metmma-backend-v2' || 'metmma-backend' }}
          PM2_APP_NAME: ${{ github.ref_name == 'version-2' && 'metmma-backend-v2' || 'metmma-backend' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          require_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deployment environment secret: $name"
              exit 1
            fi
          }

          require_env VPS_HOST
          require_env VPS_USER
          require_env VPS_SSH_KEY

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT must be numeric."
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/metmma-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          target="$VPS_USER@$VPS_HOST"
          
          # 1. Target directory on VPS
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "mkdir -p ~/$DEPLOY_DIRECTORY"
          
          # 2. SCP lightweight tarball directly to target
          scp "${opts[@]}" -P "$VPS_PORT" release.tar.gz "$target:~/$DEPLOY_DIRECTORY/"
          
          # 3. Extract, set PATH, fix permissions, run DB migrations, reload PM2
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "bash -s -- '$DEPLOY_DIRECTORY' '$PM2_APP_NAME'" << 'EOF'
            set -e

            # Export Node / PM2 PATH for non-interactive SSH shells
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            deploy_directory="$1"
            pm2_app_name="$2"
            cd "$HOME/$deploy_directory"
            if [ "$pm2_app_name" = "metmma-backend-v2" ] && [ ! -s .env ]; then
              echo "Prepare the version-2 .env with its own Neon database and PORT before deploying."
              exit 1
            fi
            
            # Extract tarball over existing files (.env remains untouched)
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # Fix executable permissions for node_modules binaries
            if [ -d "node_modules/.bin" ]; then
              chmod -R +x node_modules/.bin/
            fi

            if [ "$pm2_app_name" = "metmma-backend-v2" ]; then
              node -e 'require("dotenv").config({quiet:true}); if (!process.env.PORT || process.env.PORT === "3000" || !process.env.DATABASE_URL) { console.error("Version 2 requires DATABASE_URL and a dedicated PORT other than 3000."); process.exit(1); }'
            fi

            # Initialize database if fresh, then execute pending migrations
            echo "Running database initialization and migrations on Neon DB..."
            npm run db:init -- --if-empty
            npm run migrate

            # Reload or start process using server.js as entry point
            if pm2 describe "$pm2_app_name" > /dev/null 2>&1; then
              pm2 reload "$pm2_app_name" --update-env
            else
              pm2 start server.js --name "$pm2_app_name"
            fi

            pm2 save
            if [ "$pm2_app_name" = "metmma-backend-v2" ]; then
              node <<'NODE'
            require('dotenv').config({quiet:true});
            (async () => {
              for (let attempt = 0; attempt < 12; attempt++) {
                try {
                  const response = await fetch(`http://127.0.0.1:${process.env.PORT}/api/health`, {signal:AbortSignal.timeout(7000)});
                  if (response.ok) { console.info('Version 2 API is healthy.'); return; }
                } catch {}
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
              console.error('Version 2 API did not become healthy. Check PM2 logs.');
              process.exitCode = 1;
            })();
          NODE
            fi
          EOF
