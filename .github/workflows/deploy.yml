name: Deploy production API to Heroku

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-heroku-production-api
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy production API
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_API_APP: metmma-pharmacy-prod-api
    steps:
      - uses: actions/checkout@v4

      - name: Check Heroku credentials
        shell: bash
        run: |
          if [[ -z "${HEROKU_API_KEY:-}" ]]; then
            echo "::error::Set HEROKU_API_KEY in the production GitHub environment."
            exit 1
          fi

      - name: Install Heroku CLI
        run: curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate with Heroku
        run: heroku auth:whoami

      - name: Ensure app uses the container stack
        shell: bash
        run: |
          set -euo pipefail
          stack_output="$(heroku stack --app "$HEROKU_API_APP")"
          current_stack="$(printf '%s\n' "$stack_output" | sed -n 's/^[[:space:]]*\*[[:space:]]*//p' | head -n 1)"
          if [[ -z "$current_stack" ]]; then
            echo "::error::Could not determine the current Heroku stack for $HEROKU_API_APP."
            exit 1
          fi
          if [[ "$current_stack" != "container" ]]; then
            heroku stack:set container --app "$HEROKU_API_APP"
          else
            echo "$HEROKU_API_APP already uses the container stack."
          fi

      - name: Sign in to Heroku Container Registry
        shell: bash
        run: printf '%s' "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build API and migration images
        shell: bash
        run: |
          docker build -f backend/Dockerfile -t "registry.heroku.com/$HEROKU_API_APP/web" .
          docker build -f backend/Dockerfile.release -t "registry.heroku.com/$HEROKU_API_APP/release" .

      - name: Push and release API processes
        shell: bash
        run: |
          docker push "registry.heroku.com/$HEROKU_API_APP/web"
          docker push "registry.heroku.com/$HEROKU_API_APP/release"
          heroku container:release web release --app "$HEROKU_API_APP"

      - name: Check API health
        run: curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-connrefused https://metmma-pharmacy-prod-api-c80404fe54ae.herokuapp.com/api/health
