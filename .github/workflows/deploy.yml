name: Validate and Deploy to PM2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run check --if-present
          npm test --if-present
          npm run build
          npm prune --production

      - name: Package Release
        run: |
          mkdir release
          cp -r backend/dist backend/node_modules backend/package.json backend/prisma release/ 2>/dev/null || cp -r backend/dist backend/node_modules backend/package.json release/
          tar -czf release.tar.gz -C release .

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/metmma-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          target="$VPS_USER@$VPS_HOST"
          
          # 1. Target directory on VPS
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "mkdir -p ~/metmma-backend"
          
          # 2. SCP lightweight tarball directly to target
          scp "${opts[@]}" -P "$VPS_PORT" release.tar.gz "$target:~/metmma-backend/"
          
          # 3. Extract, run DB migrations, reload PM2
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "bash -s" << 'EOF'
            set -e
            cd ~/metmma-backend
            
            # Extract over existing files (.env is untouched)
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # Run Prisma migrations if Prisma exists
            if [ -d "prisma" ]; then
              npx prisma migrate deploy || true
            fi
            
            # Reload PM2 smoothly
            pm2 reload metmma-backend || pm2 restart metmma-backend || pm2 start dist/main.js --name "metmma-backend"
            pm2 save
          EOF