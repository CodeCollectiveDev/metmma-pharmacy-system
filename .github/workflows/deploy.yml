name: Validate and Deploy to PM2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run check --if-present
          npm test --if-present
          npm run build --if-present
          npm prune --production

      - name: Package Release
        run: |
          set -Eeuo pipefail
          # Copy repository database folder into backend directory before packaging
          cp -r database backend/database
          test -s backend/database/init.sql
          test -d backend/database/migrations
          tar -czf release.tar.gz -C backend .

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          require_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production environment secret: $name"
              exit 1
            fi
          }

          require_env VPS_HOST
          require_env VPS_USER
          require_env VPS_SSH_KEY

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT must be numeric."
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/metmma-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30)
          target="$VPS_USER@$VPS_HOST"
          
          # 1. Target directory on VPS
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "mkdir -p ~/metmma-backend"
          
          # 2. SCP lightweight tarball directly to target
          scp "${opts[@]}" -P "$VPS_PORT" release.tar.gz "$target:~/metmma-backend/"
          
          # 3. Extract, set PATH, fix permissions, run DB migrations, reload PM2
          ssh "${opts[@]}" -p "$VPS_PORT" "$target" "bash -s" << 'EOF'
            set -e

            # Export Node / PM2 PATH for non-interactive SSH shells
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            cd ~/metmma-backend
            
            # Extract tarball over existing files (.env remains untouched)
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # Fix executable permissions for node_modules binaries
            if [ -d "node_modules/.bin" ]; then
              chmod -R +x node_modules/.bin/
            fi

            # Initialize database if fresh, then execute pending migrations
            echo "Running database initialization and migrations on Neon DB..."
            npm run db:init -- --if-empty
            npm run migrate

            # Reload or start process using server.js as entry point
            if pm2 describe metmma-backend > /dev/null 2>&1; then
              pm2 reload metmma-backend --update-env
            else
              pm2 start server.js --name "metmma-backend"
            fi

            pm2 save
          EOF
