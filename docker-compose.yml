version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: metmma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metmma_pharmacy
      POSTGRES_USER: metmma_user
      POSTGRES_PASSWORD: SecurePass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: